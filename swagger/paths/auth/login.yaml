tags:
  - Auth
summary: User login
operationId: loginUser
description: Authenticate a user and return access token with refresh token in cookies
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            type: string
            format: email
            description: User's email address
            example: 'john.doe@example.com'
          password:
            type: string
            format: password
            description: User's password (6-32 characters)
            example: 'password123'
        required:
          - email
          - password
responses:
  '200':
    description: Successfully logged in
    headers:
      Set-Cookie:
        description: Refresh token cookie
        schema:
          type: string
          example: 'refreshToken=abc123; HttpOnly; Max-Age=2592000'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in an user!'
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  description: JWT access token
                  example: 'abc123-def456-ghi789'
  '400':
    description: Bad request - Validation error
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: 'Validation error'
  '401':
    description: Unauthorized - Invalid credentials
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Invalid email or password'
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 500
            message:
              type: string
              example: 'Internal server error'
