tags:
  - Auth
summary: Refresh access token
operationId: refreshAccessToken
description: Refresh access token using refresh token from cookies
security:
  - cookieAuth: []
responses:
  '200':
    description: Successfully refreshed session
    headers:
      Set-Cookie:
        description: New refresh token cookie
        schema:
          type: string
          example: 'refreshToken=new123; HttpOnly; Max-Age=2592000'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully refreshed a session!'
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  description: New JWT access token
                  example: 'new-abc123-def456-ghi789'
  '401':
    description: Unauthorized - Invalid or missing refresh token
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'No refresh token'
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 500
            message:
              type: string
              example: 'Internal server error'
