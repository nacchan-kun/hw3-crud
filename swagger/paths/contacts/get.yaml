tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: |
  Retrieve a paginated list of contacts for the authenticated user.
  Supports filtering, sorting, and pagination.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number for pagination
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
      example: 1
  - name: perPage
    in: query
    description: Number of contacts per page
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
      example: 10
  - name: sortBy
    in: query
    description: Field to sort by
    required: false
    schema:
      type: string
      enum:
        [
          name,
          email,
          phoneNumber,
          contactType,
          isFavourite,
          createdAt,
          updatedAt,
        ]
      example: name
  - name: sortOrder
    in: query
    description: Sort order
    required: false
    schema:
      type: string
      enum: [asc, desc]
      default: asc
      example: asc
  - name: type
    in: query
    description: Filter by contact type
    required: false
    schema:
      type: string
      enum: [work, home, personal]
      example: personal
  - name: isFavourite
    in: query
    description: Filter by favourite status
    required: false
    schema:
      type: boolean
      example: true
responses:
  '200':
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          $ref: ../../components/responses/contactsResponse.yaml
  '401':
    description: Unauthorized - Invalid or missing token
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Unauthorized'
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 500
            message:
              type: string
              example: 'Internal server error'
