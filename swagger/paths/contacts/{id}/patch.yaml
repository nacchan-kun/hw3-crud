tags:
  - Contacts
summary: Update contact by ID
operationId: updateContactById
description: Update an existing contact by its ID for the authenticated user with optional photo upload
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    description: Contact ID
    required: true
    schema:
      type: string
      example: '60d5f7f8f1b2c8d4e5f6g7h8'
requestBody:
  required: false
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Contact's full name
            example: 'John Doe Updated'
          phoneNumber:
            type: string
            description: Contact's phone number
            example: '+1234567891'
          email:
            type: string
            format: email
            description: Contact's email address
            example: 'john.updated@example.com'
          isFavourite:
            type: boolean
            description: Whether the contact is marked as favourite
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            description: Type of contact
            example: 'work'
          photo:
            type: string
            format: binary
            description: Contact photo file (optional)
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Contact's full name
            example: 'John Doe Updated'
          phoneNumber:
            type: string
            description: Contact's phone number
            example: '+1234567891'
          email:
            type: string
            format: email
            description: Contact's email address
            example: 'john.updated@example.com'
          isFavourite:
            type: boolean
            description: Whether the contact is marked as favourite
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            description: Type of contact
            example: 'work'
responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully patched a contact!'
            data:
              $ref: ../../../components/schemas/contact.yaml
  '400':
    description: Bad request - Validation error
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: 'Invalid contact data'
  '401':
    description: Unauthorized - Invalid or missing token
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Unauthorized'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'Contact not found'
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 500
            message:
              type: string
              example: 'Internal server error'
