type: object
properties:
  _id:
    type: string
    description: Unique identifier for the contact
    example: '60d5f7f8f1b2c8d4e5f6g7h8'
  name:
    type: string
    description: Contact's full name
    example: 'John Doe'
  phoneNumber:
    type: string
    description: Contact's phone number
    example: '+1234567890'
  email:
    type: string
    format: email
    description: Contact's email address (optional)
    example: 'john.doe@example.com'
  isFavourite:
    type: boolean
    description: Whether the contact is marked as favourite
    default: false
    example: true
  contactType:
    type: string
    enum: [work, home, personal]
    description: Type of contact
    example: 'personal'
  photo:
    type: string
    format: uri
    description: URL to contact's photo (optional)
    example: 'https://res.cloudinary.com/example/image/upload/v1234567890/contacts/photo.jpg'
  userId:
    type: string
    description: ID of the user who owns this contact
    example: '60d5f7f8f1b2c8d4e5f6g7h9'
  createdAt:
    type: string
    format: date-time
    description: Contact creation timestamp
    example: '2023-09-01T12:00:00.000Z'
  updatedAt:
    type: string
    format: date-time
    description: Contact last update timestamp
    example: '2023-09-01T12:30:00.000Z'
required:
  - name
  - phoneNumber
  - contactType
